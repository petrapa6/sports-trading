name: probe (temporary, T11)
on:
  push:
    branches: [claude/ticket-11-360uam]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: NHL schedule
        run: |
          curl -sS https://api-web.nhle.com/v1/schedule/2025-10-13 > sched.json
          jq -c 'del(.gameWeek)' sched.json | head -c 1500; echo
          jq -c '.gameWeek[0] | del(.games)' sched.json; echo
          jq -c '.gameWeek[0].games[0] | del(.tvBroadcasts)' sched.json | head -c 2500; echo
          curl -sS https://api-web.nhle.com/v1/schedule/2025-09-22 | jq -c '[.gameWeek[] | {date, types:[.games[].gameType]}]'
      - name: Kalshi game_stats
        run: |
          B=https://api.elections.kalshi.com/trade-api/v2
          for S in KXEPLGAME KXNHLGAME KXLALIGAGAME; do
            curl -sS "$B/events?series_ticker=$S&status=settled&limit=2" > ev.json
            for E in $(jq -r '.events[].event_ticker' ev.json); do
              curl -sS "$B/milestones?related_event_ticker=$E&limit=10" > ms.json
              jq -c '.milestones[0]' ms.json | head -c 1500; echo
              M=$(jq -r '.milestones[0].id' ms.json)
              echo "GAMESTATS $E $M"
              curl -sS "$B/live_data/milestone/$M/game_stats" > gs.json
              head -c 300 gs.json; echo
              jq -c 'keys' gs.json
              jq -c '.pbp | del(.periods)' gs.json | head -c 500; echo
              jq -c '.pbp.periods[] | del(.events) + {n:(.events|length)}' gs.json | head -20
              jq -c '[.pbp.periods[].events[]?] | map(.type // .event_type // .typeDescKey) | group_by(.) | map({t:.[0],n:length})' gs.json | head -c 1500; echo
              jq -c '[.pbp.periods[].events[]?] | .[0:6]' gs.json | head -c 3000; echo
              jq -c '[.pbp.periods[].events[]? | select(tostring | test("goal|score";"i"))] | .[0:6]' gs.json | head -c 5000; echo
              curl -sS "$B/live_data/milestone/$M" | head -c 2000; echo
            done
          done
