name: Publish image (disabled)

# Optional: publish pre-built images to GHCR so the Supervisor pulls instead of building on the Pi
# (SPEC.md §11). Disabled: it only runs by hand, and its job runs only when the repository variable
# PUBLISH_IMAGES is "true" (unset). To enable it, set that variable and add
# `image: ghcr.io/petrapa6/{arch}-kalshi-trader` to kalshi-trader/config.yaml.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: vars.PUBLISH_IMAGES == 'true'
    name: build and push aarch64 + amd64
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version
        id: version
        run: |
          echo "version=$(jq -r .version kalshi-trader/app/package.json)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: >-
          docker buildx build --platform ${{ matrix.platform }}
          -t ghcr.io/petrapa6/${{ matrix.arch }}-kalshi-trader:${{ steps.version.outputs.version }}
          --push kalshi-trader/
