name: Image

# Home Assistant app image (SPEC.md §11, T05): the multi-arch build under QEMU, the arm64 native-module
# check, and the amd64 container checks of `npm run verify:T05` (docker compose, run.sh, key hand-over).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64:
    name: amd64 image — compose, run.sh, key hand-over, capabilities (verify:T05, verify:T14 container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalshi-trader/app/package-lock.json
      - run: npm ci --loglevel=warn
        working-directory: kalshi-trader/app
      - run: npm run check:addon
        working-directory: kalshi-trader/app
      - run: npm run verify:T05
        working-directory: kalshi-trader/app
      # T14: capabilities of the node process, read-only root, no-new-privileges (compose, amd64).
      - run: npm run verify:T14 -- --only=container
        working-directory: kalshi-trader/app

  multiarch:
    name: arm64 + amd64 build (QEMU), arm64 better-sqlite3 check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # A job-local docker-container builder (the runner is disposable; on a workstation pass
      # `--builder <name>` instead of switching the default builder, SPEC.md §14).
      - uses: docker/setup-buildx-action@v3
      - name: docker buildx build --platform linux/arm64,linux/amd64
        run: docker buildx build --platform linux/arm64,linux/amd64 -t kalshi-trader:multiarch kalshi-trader/
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalshi-trader/app/package-lock.json
      - run: npm ci --loglevel=warn
        working-directory: kalshi-trader/app
      # Re-uses the builder's cache from the step above; loads the arm64 image and runs node under QEMU.
      - run: npm run verify:T05 -- --only=arm64
        working-directory: kalshi-trader/app
